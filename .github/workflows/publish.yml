name: Publish

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Resolve version from tag
        id: ver
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth and GitHub
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ZTiDShSp
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # --- CurseForge (enable after obtaining an API key and project id) ---
          # curseforge-id: REPLACE_WITH_CURSEFORGE_PROJECT_ID
          # curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: build/libs/*.jar
          name: Better Mount HUD (NeoForge) ${{ steps.ver.outputs.value }}
          version: ${{ steps.ver.outputs.value }}
          version-type: release
          loaders: neoforge
          environment: client
          game-versions: 26.2
          changelog: ${{ github.event.head_commit.message }}
